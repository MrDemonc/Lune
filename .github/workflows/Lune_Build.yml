name: Build Lune Release

on:
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test mode (uploads the artifact only, without creating a GitHub release)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > keystore.jks
            cp keystore.jks app/keystore.jks
          fi

      - name: Create keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            cat <<EOF > keystore.properties
          storeFile=keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          elif [ ! -f keystore.jks ]; then
            echo "No release keystore configured; generating test keystore so APK is always signed..."
            keytool -genkeypair -v -keystore keystore.jks -alias lune_test -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Lune, OU=Lune, O=Lune, C=US"
            cp keystore.jks app/keystore.jks
            cat <<EOF > keystore.properties
          storeFile=keystore.jks
          storePassword=android
          keyAlias=lune_test
          keyPassword=android
          EOF
          fi

      - name: Read versionName
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lune-${{ steps.version.outputs.version }}-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Create Github Release
        if: ${{ !inputs.test_build }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Lune ${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/*apk
